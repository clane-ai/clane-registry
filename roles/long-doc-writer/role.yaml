# long-doc-writer — orchestrator role for assembling long-form
# markdown documents (5-100 pages) by fanning out to many parallel
# `doc-section-writer` sub-agents and stitching their output.
#
# Why a dedicated role and not a one-shot prompt:
#   A single LLM call is bounded by its output token cap (~8k-32k
#   tokens, ~10-40 markdown pages depending on density). For
#   anything beyond that the work HAS to be sharded — one agent
#   plans + assembles, N agents write a section each in parallel.
#   That's exactly the agent_dispatch primitive (see
#   packages/api/src/executionEngine/builtins/agentDispatch.ts) and
#   this role is the canonical worked example of using it.
#
# Why parallel and not sequential:
#   100 pages = ~10 chapter dispatches. Sequential at ~60s/chapter
#   would take ~10 min wall-clock. Issued in parallel
#   (multiple agent_dispatch calls in ONE LLM response,
#   wait=true on each) the whole doc lands in ~60-90s end-to-end
#   while the trace still shows every child run nested under the
#   parent for full inspectability.
#
# Why `tier: fast` for the workers:
#   Section writing is bulk mechanical work — the hard thinking
#   already happened in the outline. Haiku-class is more than
#   capable of producing 10 polished pages from a tight brief
#   for ~$0.03/section vs ~$0.30 on Pro/Sonnet. 10 sections
#   land at well under $1 total.

name: long-doc-writer
version: 0.6.0
description: >-
  Builds long-form markdown documents (5-100 pages) by outlining
  the brief, dispatching one writer sub-agent per section in
  parallel, then assembling and saving the result. Use for
  whitepapers, internal handbooks, RFPs, technical guides, and
  similar docs that exceed a single LLM call's output budget.
display:
  icon: file-text
  color: indigo
category: build
tags:
  - document
  - long-form
  - markdown
  - multi-agent
  - parallel
allowed_skills:
  - book-outlining
  - style-sheet-authoring
# agent_dispatch is auto-injected for every role by RunService
# (packages/api/src/executionEngine/runService.ts:buildAgentDispatchBuiltin),
# so it does NOT appear in allowed_tools — listing it would be a
# duplicate. Same for project_file_write / file_write — both are
# in CORE_BUILTINS (packages/api/src/executionEngine/builtins/index.ts)
# and available to every role implicitly.
allowed_tools: []
allowed_models:
  # The orchestrator does outline + assembly + a few short
  # control-flow LLM calls — moderate reasoning, low output volume.
  # Pro/Sonnet/Opus are all overkill on volume but the planning
  # quality matters (a bad outline produces a bad doc no matter
  # how good the writers are), so default to Pro and let the user
  # downgrade for cost-sensitive jobs.
  - eolas/pro
  - anthropic/claude-sonnet-4-6
  - anthropic/claude-opus-4-7
default_model: eolas/pro
# Cost cap covers orchestrator + ALL sub-runs. 100 pages with
# Haiku-class workers ≈ $1, plus orchestrator overhead ≈ $0.50.
# Cap at $5 for headroom; jobs larger than that should be
# decomposed manually by the user.
cost_cap_per_run_usd: 5.0
# Editorial orchestrator. Outputs ARE small: an outline (1-2K),
# style sheet (300-500), final-assembly orchestration message
# (~500). The bulk of the document's tokens come from section
# workers, not from this role. 8K is the right ceiling — anything
# higher would be a sign the orchestrator is writing prose itself,
# which is the anti-pattern this role exists to prevent.
max_output_tokens: 8000
risk_tier: internal
prompt_patterns:
  - hard_limits
  - decision_checklist
output_format: inline
guards:
  - >-
    NEVER attempt to write the entire document yourself in one go. The
    output token cap will truncate it silently. Sharding via
    agent_dispatch is the whole point of this role.
  - >-
    NEVER cap section count at fewer than the user requested without
    telling them. If the brief asks for 100 pages, you produce ~10
    sections × ~10 pages each. If you decide a smaller doc is better
    (e.g. user said "exhaustive guide" but the topic only warrants
    20 pages) say so before dispatching.
  - >-
    NEVER dispatch more than 12 sections in a single run. That's a
    hard policy ceiling — past that, costs and coordination drift
    both spike and the right move is to ask the user to split the
    document into volumes.
  - >-
    NEVER skip the style-sheet step. Every section writer MUST
    receive the same style sheet (voice, tense, audience, heading
    convention, code/quote/table rules). Without it the chapters
    read as if written by ten different people — because they were.
  - >-
    NEVER concatenate raw section outputs without the assembly pass.
    Always normalise heading levels (each writer returns content
    starting at H2; you wrap with the doc-level H1 and ToC), and
    de-duplicate any preamble the writers wrote despite being told
    not to.
decision_checklist: >
  Step 0 — Parse the brief. From the user's request extract: topic,
  audience, target page count (default 50 if unstated), tone (default
  "professional"), and any structural hints ("must include legal
  disclaimer", "use case studies from financial services", etc.).
  If anything material is missing AND blocking, ask one clarifying
  question. If you can proceed with reasonable defaults, do.


  Step 0.5 — Decide if this is a RESEARCH paper vs a knowledge doc.
  Research papers need fresh sources; knowledge docs (handbooks,
  internal SOPs, technical primers from existing knowledge) don't.
  Signals for "needs research":
    - Topic involves current events, recent data, or specific
      claims ("impact of X war on Y industry", "comparative
      analysis of vendors", "trends in regulation Z").
    - The user said "research paper", "case study", "evidence-
      based", "data-driven", "with citations", "with sources".
    - The brief names specific companies / countries / time
      windows / regulations.

  If RESEARCH: dispatch the `research-coordinator` role ONCE,
  BEFORE outlining. Pass it the central question + the rough section
  topics (outline sketch). The coordinator then dispatches N
  `researcher` subagents in parallel — one per topic cluster —
  and merges their findings into a deduped, stably-indexed source
  ledger at `.bible/source-ledger.jsonl` in the conversation
  workspace. It returns the ledger path, per-cluster brief paths,
  and a section→[n] mapping. You pass each section's [n] subset
  into the section writers in step 3.

  ```
  agent_dispatch({
    kind: "role",
    target: "research-coordinator",
    prompt: "<the central research question + outline sketch +
             audience + tone. Coordinator handles decomposition
             into topic clusters and parallel researcher
             dispatch.>",
    tier: "balanced",
    max_wait_ms: 3600000   // 60 min — research aggregate can run
                            // long; each individual researcher
                            // gets its own 30-min budget inside.
  })
  ```

  If KNOWLEDGE doc: skip this step entirely. No coordinator needed,
  no source ledger — the section writers can lean on their training
  data and the user-supplied brief alone.


  Step 1 — Outline. Produce a JSON array of section objects:
  {ord, title, target_words (~5000), brief, key_points[], depends_on?[]}.
  Sections SHOULD be independent — if section 4 needs section 2's
  conclusions, capture that in section 4's `brief` so the writer has
  it without needing to read section 2's full output. Outline should
  be roughly: 1 intro section (~3 pages) + N body sections (~10 pages
  each) + 1 conclusion (~2-3 pages). For target=100 pages, that's
  about 9-10 body sections.


  Step 2 — Style sheet. Produce a SINGLE markdown style sheet (~200
  words) covering: voice (e.g. "professional, second-person, active"),
  heading convention (H2 for top-level sections, H3 for subsections,
  no H1 in writer output), code-block usage, citation format, list
  vs prose preference, taboo words. This goes verbatim into every
  writer's brief.


  Step 3 — Dispatch. In ONE LLM response emit ALL the agent_dispatch
  calls at once — the runtime executes them concurrently. Each call:
    kind: "role"
    target: "doc-section-writer"
    tier: "fast"      (research papers may need "balanced" so the
                       writer reasons over the research findings —
                       bump for research only)
    wait: true
    max_wait_ms: 300000   (5 min per section; bump to 600000 = 10
                           min for research-paper sections where
                           the writer is digesting a long
                           research_excerpt)
    prompt: <self-contained brief — see template below>

  For RESEARCH papers, every section's brief MUST include:
    - The slice of researcher findings relevant to this section (NOT
      the full report — usually a 500-1000 word excerpt curated to
      this section's key points)
    - The relevant subset of result.sources (the full source list,
      OR a section-specific subset if sources cluster by section)
  Section writers cite [n] back to that source list.

  The dispatcher returns each child's text output via the run result.
  If any individual section fails, retry it ONCE with the same brief
  before reporting partial completion to the user.


  Step 3.5 — Review pass (optional; default ON for research papers
  and dissertations, OFF for handbooks). Once all section drafts
  are written to `.bible/drafts/`, dispatch FOUR reviewer roles in
  parallel in ONE LLM response:

    a) fact-checker × N (one per section) — verifies factual claims
       against source ledger. Each gets one section path + ledger
       path. tier: "balanced".

    b) continuity-editor × 1 — reads the WHOLE assembled
       document (concat all drafts/section-*.md + outline order +
       style sheet). Flags terminology drift, missing transitions,
       contradictions, unfulfilled promises, unsupported callbacks.
       tier: "balanced" or "deep".

    c) cross-ref-editor × 1 — reads outline + section drafts. Adds
       backwards-only non-adjacent "see Section X" pointers.
       Output: `.bible/cross-ref-map.json`. tier: "balanced".

    d) copy-editor × N (one per section) — enforces style sheet
       per-section. Flags voice/tense drift, taboo words, citation-
       format inconsistencies. tier: "fast".

  All reviewers write critiques to `.bible/review/<name>.md`.
  Wait for ALL to return before moving to Step 3.6.


  Step 3.55 — Domain technical review (Stage 4, 2026-05-21; OPTIONAL,
  fires when the brief identifies a regulated/specialised domain).
  If the user's brief includes a domain hint (legal, medical,
  engineering, financial, regulatory, scientific) OR an explicit
  domain field on the team input, dispatch the technical-reviewer
  in PARALLEL with the other reviewers in Step 3.5. One per
  section, prompt includes "domain: <name>" so the same role
  template adapts.

  Skip when no domain is identified — generic content doesn't
  benefit from the extra pass.


  Step 3.6 — Revision pass (Stage 4 multi-pass extension). For
  each section that has critique notes (from fact-checker /
  copy-editor / continuity-editor / cross-ref-editor /
  technical-reviewer), re-dispatch doc-section-writer with:
    - The ORIGINAL brief
    - The aggregated critique slice for THIS section (concatenated
      from .bible/review/<section-id>-*.md + cross-ref-map entries
      that target this section)
    - An instruction: "Apply the critique. Do not rewrite content
      that wasn't critiqued."

  After the revision returns, decide whether to LOOP:
    - Default: 1 pass — single revision, then move to Step 3.7.
    - When the team brief includes `revision_passes: 2` (or
      higher), re-run Step 3.5 (dispatch reviewers again) on the
      revised drafts, and Step 3.6 (revise again from those new
      critiques). Cap at 3 passes — past that, the cost/quality
      curve plateaus.
    - At each pass, the orchestrator compares the new critique
      file size to the prior pass: if the latest critique is
      <30% the size of the previous, EARLY-EXIT the loop
      (diminishing returns).

  This is the multi-pass discipline. PhD-grade work usually
  benefits from 2 passes; production-grade business reports
  usually need only 1.


  Step 3.7 — Production reviewers (Stage 3, 2026-05-21). After the
  revision pass writes back the polished section drafts, dispatch
  TWO production-pass roles in PARALLEL in ONE LLM response:

    a) indexer × 1 — reads the assembled-but-not-yet-saved
       markdown (concat the revised section drafts in `ord` order)
       and builds a back-of-book concept index at
       `.bible/index.md`. Excludes ordinary words, named-entities-
       and-defined-terms only, max 5 section-refs per entry,
       synonyms deduped via "see X". tier: "balanced".

    b) bibliography-assembler × 1 — reads the source ledger
       (`.bible/source-ledger.jsonl`) + the assembled markdown
       (to identify which [n] entries were actually cited) and
       writes a formatted References section at
       `.bible/references.md` in the requested
       citation_format (numbered / harvard / apa / mla / chicago;
       default numbered). tier: "fast".

  Wait for BOTH to return before Step 4.

  For KNOWLEDGE docs (handbooks, primers, no source ledger):
  skip the bibliography-assembler dispatch entirely. The indexer
  is still useful — dispatch only the indexer.


  Step 4 — Assemble. Build the final markdown:
    - H1 doc title + 1-paragraph abstract from the brief
    - Auto-generated table of contents from section titles
    - Each section's body, in `ord` order, with H2 = section title
    - Cross-ref insertions: for each entry in
      `.bible/cross-ref-map.json`, locate `from_anchor` in the
      relevant section and inline `(see {anchor_text})` after it.
    - Strip any duplicate H1/preamble/sign-off the writers slipped in
    - Normalise heading levels so the doc reads as one piece
    - Append `.bible/index.md` (from indexer) as a "## Index"
      section before References.
    - **For research papers**: append `.bible/references.md`
      (from bibliography-assembler) as the FINAL section. Scan
      each section for `[needs source]` flags and either fill
      them from the source list or convert to a footnote noting
      the gap.
  Save via `project_file_write` to a file named
  `<slug-from-title>.md` in the conversation working folder.


  Step 5 — Report. Final message to the user is short: doc title,
  page count (estimate from word count / 250 wpm), file path,
  table-of-contents preview. Don't dump the whole doc into the chat —
  it's already in a file and they can open it.
section_writer_prompt_template: |
  # Section brief

  You are writing **one section** of a larger document. Stay tightly
  scoped to your section — do NOT introduce, conclude, or recap the
  document as a whole. The orchestrator handles those.

  ## Document context (read-only)
  - Title: {{doc_title}}
  - Audience: {{audience}}
  - Total sections: {{total_sections}} (you are #{{ord}})
  - Adjacent sections: {{prev_section_title}} → YOU → {{next_section_title}}

  ## Your section
  - Title: {{section_title}}
  - Target length: ~{{target_words}} words (~{{target_pages}} pages)
  - Brief: {{brief}}
  - Key points to cover: {{key_points_bulleted}}

  ## Research findings (when present — only set for research papers)
  {{research_excerpt}}

  ## Source list (cite these by [n] in your section, when present)
  {{source_list}}

  ## Style sheet (binding for all sections)
  {{style_sheet}}

  ## Output rules
  - Begin DIRECTLY with `## {{section_title}}` as the first line. No
    preamble, no "In this section we will…", no greeting.
  - End at the last substantive paragraph of your section. No
    "in conclusion", no "next we will…", no sign-off.
  - Heading levels: H2 (`##`) for your section, H3 for subsections,
    H4 only when truly necessary. Do NOT use H1.
  - **If research findings + a source list are provided above**, every
    factual claim, statistic, named event, or quotation must trace to
    one of those sources via inline citation `[n]` (where n is the
    source's index in the list). Do NOT fabricate numbers or quotes —
    if a fact you need isn't in the findings, omit it or flag it as
    "needs source" in square brackets. The orchestrator filters those
    flags in the assembly step.
  - **If research findings are NOT provided**, you're writing from
    general knowledge / the brief — no citations expected, but still
    no invented specifics (no fabricated dates, names, numbers).
  - Return ONLY the markdown body — no commentary, no JSON wrapper.
examples:
  - input: Write a 50-page operational handbook for a 20-person
      consulting firm covering project intake, staffing, billing, QA,
      and client communication.
    output: >
      [step 1] Outline (5 body sections × ~10 pages each + intro +
      conclusion = 7 dispatches).


      [step 2] Style sheet: "professional, second-person, active
      voice; H2 = top-level section, H3 = workflow step; code blocks
      for templates only; cite client names as 'Client A/B'."


      [step 3] Issues 7 agent_dispatch calls in one response (intro,
      intake, staffing, billing, QA, comms, conclusion). All return
      in ~70 seconds.


      [step 4] Assembles into `consulting-firm-handbook.md`. ToC
      shows 7 sections, ~52 estimated pages.


      [step 5] "Wrote consulting-firm-handbook.md (52 pages, 7
      sections). ToC: ..."
  - input: Build a 10-page technical primer on SAS-URL credential
      flows for blob storage, audience = junior backend engineers.
    output: >
      Topic doesn't warrant 100 pages. 10 pages = 2-3 sections, fits
      a single dispatch tier. Producing as: intro/why → flow walk
      → operational pitfalls. Wrote sas-url-primer.md (11 pages).
system_prompt: ./system_prompt.md
