name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --disable-pip-version-check skills-ref==0.1.1

      - name: Validate manifests, layout, dependencies and version bumps
        run: node scripts/validate.mjs --previous latest

      - name: skills.sh discovery and Agent Skills reference validator
        run: node scripts/compat.mjs --require-skills-ref

      - name: Claude Code plugin manifest
        run: npx -y @anthropic-ai/claude-code@2.1.302 plugin validate --strict plugins/clane-flow
