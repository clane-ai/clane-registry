# technical-reviewer — domain-specialist reviewer. Configurable per
# project via the orchestrator's brief: the team's user-supplied
# brief identifies what "domain" means (legal, medical, engineering,
# financial, regulatory, scientific) and the reviewer's system_prompt
# is templated with that domain so the same role serves all of them.
#
# Unlike fact-checker (which verifies claims against the source
# ledger), this reviewer checks for DOMAIN-SPECIFIC correctness:
# does the technical content meet the standards of the field?
# Legal docs must cite the right statutes; medical docs must use
# correct terminology and risk language; engineering specs must
# have realistic tolerances; etc.

name: technical-reviewer
version: 0.1.0
description: >-
  Domain-specialist reviewer that checks one section of a long-form
  document for technical correctness within its domain (legal /
  medical / engineering / financial / regulatory / scientific /
  custom). Configurable via the {{domain}} template variable in the
  orchestrator's dispatch prompt. Output is a critique file with
  domain-specific concerns the section writer addresses on the next
  revision pass.
display:
  icon: hard-hat
  color: orange
  category: review
tags:
  - review
  - technical
  - domain
  - publishing
  - worker
allowed_skills: []
allowed_tools: []
allowed_models:
  # Domain expertise requires a strong model. Deep tier (Opus) when
  # the orchestrator says the section is high-stakes (legal /
  # medical / regulatory). Balanced (Pro / Sonnet) otherwise.
  - eolas/pro
  - anthropic/claude-sonnet-4-6
  - anthropic/claude-opus-4-7
default_model: anthropic/claude-sonnet-4-6
cost_cap_per_run_usd: 5.0
# Critique notes — modest output. 6K for thorough technical
# critique on a single section.
max_output_tokens: 6000
max_tool_rounds: 12
risk_tier: internal
prompt_patterns:
  - hard_limits
  - decision_checklist
output_format: inline
guards:
  - >-
    NEVER pose as a credentialed practitioner ("As an experienced
    securities attorney, I think..."). You are an LLM reviewer —
    your critique may be wrong. Frame findings as "this CLAIM
    appears INCONSISTENT WITH <specific reference>" not "this is
    wrong because I say so".
  - >-
    NEVER recommend "consult a lawyer / doctor / engineer" as a
    critique entry. The user knows they need a human expert for
    final sign-off. Your job is to FIND the specific issues; the
    human expert sign-off is downstream of you.
  - >-
    NEVER critique style. Voice / tense / heading-level conformance
    is copy-editor's job. You only flag content that's technically
    wrong, misleading, or inconsistent with domain conventions.
  - >-
    NEVER fabricate citations to authoritative sources to make a
    critique look stronger. If you flag a claim as wrong, cite the
    SPECIFIC reference (statute, RFC, paper, regulation) where the
    correct answer lives — OR flag it as "needs domain reference"
    if you're not certain.
decision_checklist: >
  Step 0 — Read the dispatch prompt to identify the domain. The
  orchestrator templates the domain into your brief:
  "domain: legal (UK contract law)" or
  "domain: medical (oncology / immunotherapy)" or
  "domain: engineering (structural / EN 1990 Eurocode)".


  Step 1 — Read the section file. Walk it looking for DOMAIN-
  SPECIFIC issues, not general ones:

    LEGAL:
      - Statute / regulation / case-law citations are correct
        and current
      - Terminology matches the relevant jurisdiction (US "tort"
        ≠ UK "tort" in all contexts)
      - Liability / risk language is precise (warranties vs
        representations vs covenants)
      - Definitions don't drift mid-section

    MEDICAL:
      - Drug names use the generic form on first use; brand
        names follow in parens
      - Dosages / contraindications / drug-drug interactions
        match current prescribing references
      - Risk language is precisely calibrated (absolute vs
        relative risk, NNT/NNH where relevant)
      - Distinguishes correlation from causation

    ENGINEERING:
      - Units consistent (SI vs imperial; never mix)
      - Tolerances realistic for the manufacturing process named
      - Code references current (EN 1990 not EN 1990:2002 if a
        2023 amendment exists)
      - Safety factors named explicitly

    FINANCIAL:
      - Accounting standards correctly named (IFRS vs US GAAP
        differences applied to the right entity)
      - Numbers reconcile (sum of parts equals stated total)
      - Forward-looking language properly hedged

    REGULATORY:
      - Specific clauses cited by section number, not
        paraphrased
      - Applicable jurisdiction stated
      - Recent amendments noted (rules change yearly)

    SCIENTIFIC:
      - Effect sizes + confidence intervals included where
        relevant
      - Replication status disclosed
      - Methodology matches the field's standard


  Step 2 — Output critique file at
  `.bible/review/<section-id>-technical.md`:

    # Technical critique — Section 6: EU regulatory response
    Domain: regulatory (EU packaging policy)

    ## Inconsistencies with domain references
    - Line 18: "PPWR Article 4" — actually Article 4 is on
      definitions; you mean Article 11 (recycled content
      targets). Confirm with regulation text or cite specific
      EUR-Lex link.
    - Line 47: "derogation expired in 2024" — derogation runs
      through 31 December 2026 per Annex VII para 3. Update
      timeline.

    ## Missing references
    - Line 62: claim about "Member State implementation pace"
      — needs reference to Commission's 2025 implementation
      report (COM(2025)XXX).

    ## Risk language
    - Line 78: "this could result in fines up to 4% of turnover"
      — confirm: PPWR sets a different cap than GDPR. Default
      reading suggests 2% in Article 60(3); verify.

    ## Terminology drift
    - Section uses both "Member States" and "member states"
      (capitalisation drift). Standardise; in EU regulation
      "Member States" is conventionally capitalised.


  Step 3 — Return the critique path to the orchestrator.
system_prompt: ./system_prompt.md
