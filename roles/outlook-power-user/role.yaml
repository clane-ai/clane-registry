name: outlook-power-user
version: 0.1.0
description: >-
  AI assistant for Outlook. Reads the email or draft the user has open,
  summarises threads, drafts replies, and bootstraps new messages — directly
  inside Outlook via the Clane Outlook Add-in.
# The prompt lives in system_prompt.md beside this file; the registry
# loader inlines it before the role manifest is parsed.
system_prompt: ./system_prompt.md
display:
  icon: mail
  color: blue
category: communicate
tags:
  - outlook
  - email
  - communication
allowed_skills:
  # Inbox triage + email-shaped reasoning
  - inbox-triage
  # Pulling structured rows out of email/PDF/etc.
  - narrative-extraction
  # Already in CORE_SKILL_NAMES (auto-available); listing for explicitness.
  - web-search
# Same denylist as excel-power-user — Outlook agent can't deliver
# .docx / .pptx files into the inbox surface; image-creator generates
# files (also not deliverable here); interactive-component renders in
# the SPA artifact panel which the addin iframe doesn't host.
denied_skills:
  - docx
  - pptx
  - image-creator
  - interactive-component
allowed_tools: []
priority_tools:
  # Edge tools — surfaced eagerly so the model sees them on round 1
  # without a tool_search call. Each goes through EdgeToolAdapter,
  # routed via SSE edge_invoke to the connected Outlook addin.
  - outlook_get_message
  - outlook_get_attachments
  - outlook_compose_reply
  - outlook_compose_new
  - outlook_set_compose_body
edge_only: true
allowed_models:
  # Default — Clane Pro (Kimi K2.6 via Moonshot direct, the same
  # default as excel-power-user). Reasoning + native tool calls fit
  # email workflows well: read message → reason about tone/intent →
  # draft reply.
  - nexa/pro
  - openrouter/moonshotai/kimi-k2.6
  - anthropic/claude-sonnet-4-6
  - anthropic/claude-opus-4-7
  - openai/gpt-5.5
default_model: nexa/pro
# No cost cap — email workflows are typically 2-4 rounds (read + draft +
# maybe reword). Same uncapped policy as excel-power-user; org-level
# token quotas in the user store still apply.
# cost_cap_per_run_usd: <intentionally omitted>
# Tighter ceiling than the Excel role — email work doesn't need 60
# rounds. 15 rounds covers read + draft + reword + reword-again loops
# with comfortable headroom.
max_tool_rounds: 15
risk_tier: internal
prompt_patterns:
  - hard_limits
  - decision_checklist
output_format: inline
guards:
  - >-
    NEVER send mail directly. There is no send-mail tool. Every "draft
    and send" workflow MUST end with the user clicking Send in the
    compose window you opened. If the user asks you to send for them,
    explain that they need to click Send themselves.
  - >-
    NEVER write a reply without first calling outlook_get_message. You
    don't know the thread context, the sender's tone, or the recipient
    list until you've read the current item.
  - >-
    NEVER call outlook_set_compose_body in read mode. The tool errors
    out anyway, but framing it as a guard saves the round-trip — check
    the `mode` field on outlook_get_message first.
  - >-
    Match the thread's existing tone (formal vs casual, technical vs
    business, language). Don't impose a default style on every reply.
decision_checklist: >
  Step 0 — Read the current item. outlook_get_message tells you mode,
  thread, sender, body, recipients. Without it, anything you draft is
  a guess.


  Step 1 — Decide the right tool. Replying to an open email →
  outlook_compose_reply. Bootstrapping a new email →
  outlook_compose_new. Modifying a draft the user already has open →
  outlook_set_compose_body.


  Step 2 — Tone-match. Read the body's existing tone before drafting.
  Mirror formality, length, and language. Don't be generic.


  Step 3 — Surface the draft. After opening the compose window, summarise
  what you drafted in chat ("I've drafted a polite decline, mentioning
  your alternative date — review and click Send when ready").
