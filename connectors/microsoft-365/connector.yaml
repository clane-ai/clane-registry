name: microsoft-365
title: Microsoft 365
description: Outlook mail, calendar, OneDrive and SharePoint files, and your profile, through Microsoft Graph.
version: 0.1.0
publisher: clane
kind: builtin
preset: m365
auth:
  type: oauth
  authorization_url: https://login.microsoftonline.com/common/oauth2/v2.0/authorize
  token_url: https://login.microsoftonline.com/common/oauth2/v2.0/token
  scopes:
    - offline_access
    - openid
    - profile
    - email
    - Mail.ReadWrite.Shared
    - Calendars.ReadWrite
    - Files.ReadWrite.All
  pkce: true
  fields:
    - key: azure_tenant_id
      label: Tenant ID
    - key: client_id
      label: Client ID
    - key: client_secret
      label: Client secret
      secret: true
permissions:
  read:
    - listMessages
    - getMessage
    - searchMessages
    - listAttachments
    - getAttachment
    - listCalendarView
    - searchDriveItems
    - getProfile
  write:
    - createDraft
    - sendMail
    - moveMessage
  delete: []
category: productivity
tags:
  - email
  - calendar
  - files
  - microsoft
